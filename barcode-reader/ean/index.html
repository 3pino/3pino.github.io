<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>JAN / EAN専用 | バーコード読み取り</title>
    <link rel="stylesheet" href="../styles.css?view=auto">
    <script type="module" src="../app.js?formats=limited"></script>
  </head>
  <body data-format="ean">
    <header>
      <div class="header-inner">
        <h1>JAN / EAN読み取り</h1>
      </div>
    </header>
    <main>
      <div class="reader">
        <section id="preview" aria-label="カメラ映像" hidden>
          <video id="video" autoplay muted playsinline></video>
          <div class="guide" aria-hidden="true"></div>
        </section>
        <p id="status" class="hint" role="status" aria-live="polite">カメラを準備しています。</p>
        <section id="result" hidden>
          <label for="code">読み取り結果</label>
          <textarea id="code" rows="4" readonly spellcheck="false" autocapitalize="off"></textarea>
        </section>
        <div class="actions">
          <button id="copyClose" type="button" hidden disabled>コピーして閉じる</button>
          <button id="retry" class="muted" type="button" hidden>読み直す</button>
        </div>
        <footer class="hint">
          <a href="../vendor/NOTICE.txt">使用ライブラリ</a>
        </footer>
        <noscript><p>JavaScriptを有効にしてください。</p></noscript>
      </div>
    </main>
  </body>
</html>
